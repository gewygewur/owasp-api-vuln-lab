# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# FIXED: Use a strong secret
app.jwt.secret=ThisIsAVeryStrongSecretKeyForJWT123!ThisIsAVeryStrongSecretKeyForJWT123!
# FIXED: Reasonable token validity (1 hour)
app.jwt.ttl-seconds=3600

# FIXED: Do not expose error details in production
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

logging.level.root=INFO
